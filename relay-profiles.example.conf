# Профили RU-релея: один сервер с несколькими входными IP / направлениями.
# Запуск: sudo bash setup_ru_relay.sh --profiles /root/relay-profiles.conf
# Каждая секция [имя] (a-z, 0-9, _, -, до 16 символов) = один вход listen_ip:listen_port -> свои EU-ноды.
# Для отдельных серверов используйте тот же формат: на каждом сервере оставьте свой(и) профиль(и).

[msk1]
listen_ip = 192.0.2.10        # локальный IPv4 этого сервера (обязательно); за NAT — внутренний адрес
public_ip = 192.0.2.10        # (опц.) публичный IP для проверки DNS, если отличается от listen_ip
listen_port = 443
eu_ip = 203.0.113.10          # один или несколько (пул) IP европейской ноды через пробел
eu_tcp_port = 443
eu_udp_port = 0               # 0 — UDP выключен
site_domain = site1.example.com
sni_mode = 2                  # 1 legacy, 2 строгий whitelist (рекомендуется), 3 прозрачный
vpn_snis = sni1.example.ru sni2.example.ru
cert_mode = letsencrypt       # или selfsigned (только для теста)
le_email =

[msk2]
listen_ip = 192.0.2.11
listen_port = 443
eu_ip = 203.0.113.20 203.0.113.21
eu_tcp_port = 443
eu_udp_port = 0
site_domain = site2.example.com
sni_mode = 2
vpn_snis = sni3.example.ru
cert_mode = letsencrypt
